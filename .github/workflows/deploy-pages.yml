name: Deploy SearchLabs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: python -m pip install pygbag==0.9.3

      - name: Check Python syntax
        run: python -m compileall -q main.py grid.py algorithms

      - name: Build Pygbag site
        run: python -m pygbag --archive .

      - name: Validate Pages artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          web = Path("build/web")
          required = (
              web / "index.html",
              web / "favicon.png",
              web / "searchlabs.apk",
              web / "searchlabs.tar.gz",
              Path("build/web.zip"),
          )

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing Pygbag build files: {missing}")

          html = (web / "index.html").read_text(encoding="utf-8")
          expected = (
              'href="favicon.png"',
              'platform.fopen("searchlabs.apk"',
              'platform.fopen("searchlabs.tar.gz"',
              'data-python="python3.12"',
              "https://pygame-web.github.io/cdn/0.9.3/",
          )
          absent = [value for value in expected if value not in html]
          if absent:
              raise SystemExit(f"Unexpected Pygbag index.html; missing: {absent}")

          forbidden = ('href="/', 'src="/', 'fopen("/')
          found = [value for value in forbidden if value in html]
          if found:
              raise SystemExit(f"Root-relative URLs would break project Pages: {found}")

          with zipfile.ZipFile(web / "searchlabs.apk") as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise SystemExit(f"Corrupt APK member: {bad_file}")

          with tarfile.open(web / "searchlabs.tar.gz", "r:gz") as archive:
              if not archive.getmembers():
                  raise SystemExit("Pygbag tarball is empty")

          with zipfile.ZipFile("build/web.zip") as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise SystemExit(f"Corrupt web.zip member: {bad_file}")

          print("Pygbag Pages artifact validated successfully")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
